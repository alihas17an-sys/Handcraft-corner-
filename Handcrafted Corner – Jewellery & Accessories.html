<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handcrafted Corner – Jewellery &amp; Accessories</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf7;--card:#fff;--ink:#4e3427;--mut:#8a7468;--pink:#f4c6d0;--rose:#e58ea3;--blush:#fdeef1;--gold:#c9a24b;--line:#f0e3dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Poppins,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0}
a{color:inherit;text-decoration:none}img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,250,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px}
.brand img{width:48px;height:48px;border-radius:50%;border:1px solid var(--line)}
nav{margin-left:auto;display:flex;gap:6px;align-items:center}
nav a{padding:7px 13px;border-radius:20px;font-weight:500}
nav a.on,nav a:hover{background:var(--blush);color:#b4506a}
#burger{display:none;margin-left:auto;background:none;border:0;font-size:26px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:26px;padding:11px 22px;font:500 14px Poppins,sans-serif;cursor:pointer;background:var(--rose);color:#fff}
.btn:hover{filter:brightness(.95)}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#25d366}.btn.sm{padding:8px 15px;font-size:13px}.btn.red{background:#d9534f}
.hero{background:linear-gradient(135deg,#fdeef1,#fff6ea 60%,#f9f1ff);padding:48px 0}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:52px;line-height:1.05}.hero p{color:var(--mut);max-width:460px}
.hero img.lg{width:min(320px,80%);justify-self:center;border-radius:50%;box-shadow:0 18px 50px rgba(229,142,163,.35)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
section{padding:42px 0}.ttl{text-align:center;margin-bottom:24px}.ttl h2{font-size:36px}.ttl p{color:var(--mut);margin:4px 0 0}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 10px;text-align:center;font-weight:500}
.cat:hover{border-color:var(--rose);transform:translateY(-2px)}.cat b{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pc .im{aspect-ratio:1;background:linear-gradient(135deg,var(--blush),#fff3e2);display:grid;place-items:center;font-size:54px}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:13px;display:flex;flex-direction:column;gap:4px;flex:1}.pc small{color:var(--mut)}
.pc h3{font-size:20px}.pr{font-weight:600}.pr s{color:var(--mut);font-weight:400;margin-left:6px}.pr em{font-style:normal;color:#c2415f}
.tag{position:absolute;top:10px;left:10px;background:#c2415f;color:#fff;font-size:12px;padding:2px 10px;border-radius:12px;z-index:2}
.tag.so{background:#777}.pc .btn{margin-top:auto;justify-content:center}
.ann{background:#c2415f;color:#fff;text-align:center;padding:7px 12px;font-size:14px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feat div{background:var(--blush);border-radius:16px;padding:20px;text-align:center}.feat b{font-size:26px;display:block}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.tools input{flex:1;min-width:160px}.tools select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}.chip.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.f{display:grid;gap:10px}.f label{font-size:13px;color:var(--mut);display:grid;gap:3px}.f .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.arow .th{width:46px;height:46px;border-radius:10px;background:var(--blush);display:grid;place-items:center;overflow:hidden;flex:none}.arow .th img{width:100%;height:100%;object-fit:cover}.arow .i{flex:1;min-width:0}
footer{background:#f7e9e4;margin-top:30px;padding:30px 0 90px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:#25d366;color:#fff;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#fab svg{width:32px;height:32px;fill:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;z-index:50;display:none}
.empty{text-align:center;color:var(--mut);padding:40px 0}
@media(max-width:760px){#burger{display:block}nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px;border-bottom:1px solid var(--line);align-items:stretch}nav.open{display:flex}
.hero .wrap,.two{grid-template-columns:1fr}.hero h1{font-size:40px}.hero img.lg{order:-1;width:200px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.pc h3{font-size:17px}}
.cartb{margin-left:6px;padding:7px 13px;border-radius:20px;background:var(--blush);font-weight:600;white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--ink)}
.sum{display:flex;justify-content:space-between;margin:6px 0}
@media(max-width:760px){.cartb{margin-left:auto;order:1}#burger{order:2;margin-left:8px}}
.fl{position:relative;overflow:hidden;cursor:pointer}.fl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;padding:0;border:0}
.pvw{width:120px;height:120px;border-radius:14px;background:var(--blush);display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:12px;text-align:center;flex:none}.pvw img{width:100%;height:100%;object-fit:cover}
.gal{columns:3 200px;gap:12px}.gi{display:block;margin-bottom:12px;position:relative;border-radius:14px;overflow:hidden;break-inside:avoid;border:1px solid var(--line)}.gi img{width:100%;display:block}.gi span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(78,52,39,.7));color:#fff;font-size:13px}
details.qa{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}details.qa summary{cursor:pointer;font-weight:600}details.qa p{margin:8px 0 0;color:var(--mut)}
nav a{padding:7px 11px}nav a.hot{color:#c2415f}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pc a.im{text-decoration:none}
#burger{display:none!important}
@media(max-width:760px){.bar{height:auto;min-height:60px;flex-wrap:wrap;padding:6px 0 0}.brand{font-size:19px}.brand img{width:42px;height:42px}
header nav{display:flex!important;order:3;width:100%;position:static;flex-direction:row;overflow-x:auto;white-space:nowrap;gap:6px;margin:0;padding:6px 0 10px;border:0;background:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
header nav::-webkit-scrollbar{display:none}header nav a{flex:none;background:#fff;border:1px solid var(--line);padding:6px 14px;font-size:14px}header nav a.on{background:var(--rose);border-color:var(--rose);color:#fff}}
</style></head><body>

async function shrink(f){

<section><div class="wrap"><div class="ttl"><h2>Shop by Category</h2><p>Find something you will love</p></div><div class="cats">${Object.keys(CATS).map(c=>`<a class="cat" href="#/shop" data-cat="${c}"><b>${CATS[c]}</b>${c}</a>`).join('')}</div></div></section>
<section style="background:#fff"><div class="wrap"><div class="ttl"><h2>New Arrivals</h2><p>Fresh from our workshop</p></div>${P.length?grid(nw)+'<div class="row" style="justify-content:center"><a class="btn alt" href="#/shop">View all products</a></div>':'<p class="empty">✨ Our collection is coming soon.<br>Follow us on Instagram for updates!</p>'}</div></section>
${sl.length?`<section><div class="wrap"><div class="ttl"><h2>🔥 On Sale</h2><p>Grab these before they are gone</p></div>${grid(sl)}<div class="row" style="justify-content:center"><a class="btn alt" href="#/sale">See all offers</a></div></div></section>`:''}
<section style="background:#fff"><div class="wrap"><div class="feat"><div><b>🤲</b><h3>Handcrafted</h3>Every piece is made by hand with care.</div><div><b>🎁</b><h3>Perfect for gifting</h3>Pretty pieces for birthdays and special days.</div><div><b>💬</b><h3>Easy ordering</h3>Place your order and we confirm it on WhatsApp.</div></div></div></section>
<section style="background:var(--blush)"><div class="wrap ttl"><h2>Follow us on Instagram</h2><p>See new designs and behind-the-scenes</p><div class="row" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="${esc(S.ig)}">Open Instagram</a></div></div></section>`},
shop:()=>{let l=S.products.filter(p=>(flt.cat=='All'||p.cat==flt.cat)&&p.name.toLowerCase().includes(flt.q.toLowerCase())&&(!flt.sale||eff(p)<p.price));
if(flt.sort=='lo')l.sort((a,b)=>eff(a)-eff(b));if(flt.sort=='hi')l.sort((a,b)=>eff(b)-eff(a));if(flt.sort=='new')l.sort((a,b)=>(b.ts||0)-(a.ts||0));
return `<section><div class="wrap"><div class="ttl"><h2>Our Collection</h2><p>Add your favourites to the cart and order in minutes</p></div>
<div class="chips">${['All',...Object.keys(CATS)].map(c=>`<span class="chip ${flt.cat==c?'on':''}" data-chip="${c}">${c}</span>`).join('')}<span class="chip ${flt.sale?'on':''}" data-sale="1">🔥 On Sale</span></div>
<div class="tools"><input id="q" placeholder="Search products…" value="${esc(flt.q)}"><select id="so"><option value="new">Newest</option><option value="lo" ${flt.sort=='lo'?'selected':''}>Price: low to high</option><option value="hi" ${flt.sort=='hi'?'selected':''}>Price: high to low</option></select></div>
<div id="pg">${grid(l)||'<p class="empty">'+(S.products.length?'No products found.':'Our collection is coming soon ✨')+'</p>'}</div></div></section>`},
new:()=>{const l=[...S.products].sort((a,b)=>(b.ts||0)-(a.ts||0));return `<section><div class="wrap"><div class="ttl"><h2>New Arrivals</h2><p>Our latest handmade pieces</p></div>${grid(l)||'<p class="empty">New designs coming soon ✨<br><br><a class="btn alt" target="_blank" rel="noopener" href="'+esc(S.ig)+'">Follow us on Instagram</a></p>'}</div></section>`},
sale:()=>{const l=S.products.filter(p=>eff(p)<p.price);return `<section><div class="wrap"><div class="ttl"><h2>🔥 Sale &amp; Offers</h2><p>${esc(S.sale.pct>0?(S.sale.text||'Sale – '+S.sale.pct+'% off everything!'):'Special prices on selected pieces')}</p></div>${grid(l)||'<p class="empty">No offers right now.<br>Follow us on Instagram to hear about our next sale!<br><br><a class="btn" href="#/shop">Browse the shop</a></p>'}</div></section>`},
gallery:()=>{const l=S.products.filter(p=>p.img);return `<section><div class="wrap"><div class="ttl"><h2>Gallery</h2><p>A peek at our handmade pieces</p></div>${l.length?`<div class="gal">${l.map(p=>`<a class="gi" href="#/p/${p.id}"><img src="${p.img}" alt="${esc(p.name)}" loading="lazy"><span>${esc(p.name)}</span></a>`).join('')}</div>`:'<p class="empty">Photos coming soon ✨</p>'}<div class="row" style="justify-content:center"><a class="btn alt" target="_blank" rel="noopener" href="${esc(S.ig)}">More on Instagram</a></div></div></section>`},
p:id=>{const p=S.products.find(x=>x.id==id);if(!p)return `<section><div class="wrap"><p class="empty">Product not found.<br><br><a class="btn" href="#/shop">Back to shop</a></p></div></section>`;
const e=eff(p),on=e<p.price,rel=S.products.filter(x=>x.cat==p.cat&&x.id!=p.id).slice(0,4);
return `<section><div class="wrap"><a href="#/shop" style="color:var(--mut)">← Back to shop</a><div class="two" style="margin-top:14px"><div class="pc"><div class="im" style="cursor:default">${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:CATS[p.cat]||'✨'}</div></div><div><small>${esc(p.cat)}</small><h1 style="font-size:40px;line-height:1.1">${esc(p.name)}</h1><div class="pr" style="font-size:22px;margin:8px 0">${on?`<em>${rs(e)}</em><s>${rs(p.price)}</s>`:rs(p.price)}</div><p style="color:var(--mut);white-space:pre-line">${esc(p.desc)}</p>${p.stock?`<div class="row"><button class="btn" data-add="${p.id}">Add to Cart 🛍</button><a class="btn wa" target="_blank" rel="noopener" href="${wa('Assalam o Alaikum! I’d like to order: '+p.name+' ('+rs(e)+')')}">Order on WhatsApp</a></div>`:'<p><b>Currently unavailable</b></p>'}</div></div>${rel.length?`<div class="ttl" style="margin-top:36px"><h2>You may also like</h2></div>${grid(rel)}`:''}</div></section>`},
cart:()=>{const T=totals();if(!T.l.length)return `<section><div class="wrap"><div class="ttl"><h2>Your Cart</h2></div><p class="empty">Your cart is empty.<br><br><a class="btn" href="#/shop">Continue shopping</a></p></div></section>`;
const pays=S.cfg.pay.split(',').map(s=>s.trim()).filter(Boolean);
return `<section><div class="wrap"><div class="ttl"><h2>Checkout</h2><p>Fill in your details – your order will be sent to us on WhatsApp</p></div><div class="two">
<div class="box"><h3 style="font-size:26px;margin-bottom:6px">Your items</h3>${T.l.map(x=>`<div class="arow"><div class="th">${x.p.img?`<img src="${x.p.img}" alt="">`:CATS[x.p.cat]||'✨'}</div><div class="i"><b>${esc(x.p.name)}</b><br><small>${rs(eff(x.p))}</small></div><div class="qty"><button data-q="${x.p.id}" data-step="-1">−</button><span>${x.q}</span><button data-q="${x.p.id}" data-step="1">+</button></div><button class="btn red sm" data-rm="${x.p.id}">✕</button></div>`).join('')}
<div class="sum" style="margin-top:12px"><span>Subtotal</span><b>${rs(T.sub)}</b></div><div class="sum"><span>Delivery</span><b>${T.dl?rs(T.dl):'Free'}</b></div><div class="sum"><span>Total</span><b style="font-size:20px">${rs(T.tot)}</b></div>${S.cfg.free>0&&T.dl?`<small>Free delivery on orders of ${rs(S.cfg.free)} or more</small>`:''}</div>
<div class="box"><h3 style="font-size:26px;margin-bottom:10px">Delivery details</h3><div class="f">
<label>Full name<input id="oN" autocomplete="name"></label><label>Phone number<input id="oP" type="tel" placeholder="03XX XXXXXXX" autocomplete="tel"></label>
<label>City<input id="oC"></label><label>Complete address<textarea id="oA" rows="3" placeholder="House no, street, area, landmark"></textarea></label>
<label>Payment method<select id="oY">${pays.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Order notes (optional)<input id="oT"></label>

faq:()=>{const q=[['How do I place an order?','Add your favourite pieces to the cart, fill in your name, phone and full address, then tap “Place Order on WhatsApp”. Send the message and we will confirm your order there.'],['Which payment methods are available?',S.cfg.pay],['What are the delivery charges?',(+S.cfg.delivery?'Delivery is '+rs(S.cfg.delivery)+'.':'Delivery is free.')+(S.cfg.free>0?' Orders of '+rs(S.cfg.free)+' or more get free delivery.':'')+' Message us on WhatsApp to confirm delivery time for your city.'],['What if there is a problem with my order?',S.cfg.policy],['How can I see new designs?','Follow us on Instagram @'+S.ig.split('/').filter(Boolean).pop()+' for new pieces and updates.']];
return `<section><div class="wrap" style="max-width:760px"><div class="ttl"><h2>Frequently Asked Questions</h2></div>${q.map(x=>`<details class="qa"><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}<div class="row" style="justify-content:center"><a class="btn wa" target="_blank" rel="noopener" href="${wa('Assalam o Alaikum!')}">Ask us on WhatsApp</a></div></div></section>`},
contact:()=>`<section><div class="wrap" style="max-width:860px"><div class="ttl"><h2>Contact &amp; Orders</h2><p>We reply fastest on WhatsApp</p></div><div class="two"><div class="box"><h3 style="font-size:26px">Get in touch</h3><p>📱 WhatsApp: +${esc(S.phone)}<br>📸 Instagram: @${esc(S.ig.split('/').filter(Boolean).pop())}</p><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="${wa('Assalam o Alaikum!')}">WhatsApp us</a><a class="btn" target="_blank" rel="noopener" href="${esc(S.ig)}">Instagram</a></div></div><div class="box"><h3 style="font-size:26px">How to order</h3><p>1. Add your favourite pieces to the cart.<br>2. Enter your name, phone and full address.<br>3. Tap “Place Order on WhatsApp” and send the message.<br>4. We confirm and prepare your order with love 💝</p></div></div></div></section>`,
admin:()=>{if(!admin)return `<section><div class="wrap" style="max-width:600px"><div class="box" style="text-align:center"><h2>Admin Panel</h2><p>Only the site owner can manage products. Open this page while signed in to the owner’s Claude account.</p></div></div></section>`;
if(!ok){const set=!!S.cfg.pw;return `<section><div class="wrap" style="max-width:420px"><div class="box"><h2 style="font-size:32px;text-align:center">🔐 Admin ${set?'Login':'Setup'}</h2><div class="f"><p style="margin:0;color:var(--mut)">${set?'Enter your admin password.':'Create a password for your admin panel (at least 6 characters).'}</p><input id="pw" type="password" placeholder="Password" autocomplete="${set?'current-password':'new-password'}">${set?'':'<input id="pw2" type="password" placeholder="Confirm password">'}<button class="btn" id="lg">${set?'Login':'Create password'}</button></div></div></div></section>`}
const T={list:'📦 Products',add:ed?'✏️ Edit Product':'➕ Add Product',sale:'🔥 Sale',set:'⚙️ Settings'};let b='';
const P=S.products;
if(atab=='list')b=`<div class="feat" style="margin-bottom:16px"><div><b>${P.length}</b>Products</div><div><b>${P.filter(p=>eff(p)<p.price).length}</b>On sale</div><div><b>${P.filter(p=>!p.stock).length}</b>Sold out</div></div><div class="box"><input id="as" placeholder="Search products…" style="margin-bottom:8px"><div id="al">${arows('')}</div></div>`;
if(atab=='add'){const p=ed||{name:'',cat:'Earrings',price:'',sale:'',desc:'',img:'',stock:true};
b=`<div class="box"><div class="f"><label>Product name<input id="fn" value="${esc(p.name)}"></label>
<div class="g2"><label>Category<select id="fc">${Object.keys(CATS).map(c=>`<option ${c==p.cat?'selected':''}>${c}</option>`).join('')}</select></label><label>Stock<select id="fs"><option value="1">Available</option><option value="0" ${p.stock?'':'selected'}>Sold out</option></select></label></div>
<div class="g2"><label>Price (Rs)<input id="fp" type="number" min="0" inputmode="numeric" value="${p.price}"></label><label>Sale price (Rs, optional)<input id="fl" type="number" min="0" inputmode="numeric" value="${p.sale||''}"></label></div>
<label>Description<textarea id="fd" rows="3">${esc(p.desc)}</textarea></label>
<div><div style="font-size:13px;color:var(--mut);margin-bottom:6px">Photo</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="pvw" id="pv">${p.img?`<img src="${p.img}" alt="">`:'No photo'}</div><div class="f" style="gap:8px"><span class="btn alt sm fl">🖼 Choose from gallery<input id="fi" type="file" accept="image/*"></span><span class="btn alt sm fl">📸 Take photo<input id="fc2" type="file" accept="image/*" capture="environment"></span>${p.img?'<button class="btn red sm" id="rp">Remove photo</button>':''}<button class="btn alt sm" id="pp">📋 Paste copied photo</button></div></div><small id="pst" style="color:var(--mut)">JPG or PNG – the photo is resized automatically. If the gallery does not open in this app, open the website in your phone’s browser (Chrome or Safari) and sign in, or copy a photo and tap “Paste copied photo”.</small></div>
<div class="row" style="margin:0"><button class="btn" id="sv">${ed?'Update product':'Add product'}</button>${ed?'<button class="btn alt" id="cn">Cancel</button>':''}</div></div></div>`}
if(atab=='sale')b=`<div class="box"><div class="f"><p style="margin:0;color:var(--mut)">Give a discount on every product. For a single product, set its “Sale price” when you edit it.</p><label>Discount % on all products (0 = no sale)<input id="sp" type="number" min="0" max="90" inputmode="numeric" value="${S.sale.pct}"></label><label>Banner text (shown at the top of the site)<input id="st" value="${esc(S.sale.text)}" placeholder="e.g. Eid Sale – 20% off everything!"></label><div class="row" style="margin:0"><button class="btn" id="ss">Start / update sale</button>${S.sale.pct>0?'<button class="btn alt" id="sx">Stop sale</button>':''}</div></div></div>`;
if(atab=='set')b=`<div class="box"><div class="f"><label>WhatsApp number (with country code, e.g. 923001234567)<input id="cw" value="${esc(S.phone)}"></label><label>Instagram link<input id="ci" value="${esc(S.ig)}"></label><div class="g2"><label>Delivery charges (Rs)<input id="cd" type="number" min="0" inputmode="numeric" value="${S.cfg.delivery}"></label><label>Free delivery above (Rs, 0 = off)<input id="cf" type="number" min="0" inputmode="numeric" value="${S.cfg.free}"></label></div><label>Payment methods (comma separated)<input id="cp" value="${esc(S.cfg.pay)}"></label><label>Problem / return message (shown in FAQ)<textarea id="cpol" rows="2">${esc(S.cfg.policy)}</textarea></label><label>About us text<textarea id="cab" rows="5">${esc(S.cfg.about)}</textarea></label><label>Change admin password (leave empty to keep)<input id="cpw" type="password"></label><button class="btn" id="sc">Save settings</button></div></div>`;
return `<section><div class="wrap" style="max-width:900px"><div class="ttl"><h2>Admin Panel</h2><p>Changes are saved to the website automatically</p></div><div class="row" style="justify-content:center;margin:0 0 16px"><button class="btn alt sm" id="pub">Publish now</button><button class="btn alt sm" id="lo">Logout</button></div><div class="chips" style="justify-content:center">${Object.keys(T).map(k=>`<span class="chip ${atab==k?'on':''}" data-tab="${k}">${T[k]}</span>`).join('')}</div>${b}</div></section>`}};
function ann(){const a=$('#ann');a.innerHTML=S.sale.pct>0?`<div class="ann">🔥 ${esc(S.sale.text||('Sale – '+S.sale.pct+'% off everything!'))}</div>`:''}
function route(keep){const pt=location.hash.replace(/^#\/?/,'').split('?')[0].split('/'),r=pt[0],k=H[r]?r:'';
app.innerHTML=H[k](pt[1]);document.querySelectorAll('nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r==(k=='p'?'shop':k)));$('#nav').classList.remove('open');ann();if(!keep)window.scrollTo(0,0);cnt()}
function link(){const h=S.ig.split('/').filter(Boolean).pop();$('#igF').href=S.ig;$('#igF').textContent='Instagram @'+h;$('#waF').href=$('#fab').href=wa('Assalam o Alaikum!');$('#waF').textContent='WhatsApp +'+S.phone;$('#yr').textContent=new Date().getFullYear()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-chip],[data-sale],[data-cat],[data-tab],[data-e],[data-d],[data-so],[data-add],[data-q],[data-rm],#lg,#lo,#rp,#pp,#sv,#cn,#ss,#sx,#sc,#po,#pub,#burger');if(!t)return;const id=t.id,ds=t.dataset;
if(id=='burger')return $('#nav').classList.toggle('open');
if(id=='lo'){ok=false;sess(0);return route()}
if(id=='lg'){const pw=$('#pw').value;if(pw.length<6)return toast('Password must be at least 6 characters');
if(!S.cfg.pw){if(pw!==$('#pw2').value)return toast('Passwords do not match');S.cfg.pw=await hash(pw);ok=true;sess(1);route();return save('Password created')}
if(await hash(pw)!==S.cfg.pw)return toast('❌ Wrong password');ok=true;sess(1);return route()}
if(ds.add){cart[ds.add]=(cart[ds.add]||0)+1;saveCart();return toast('Added to cart ✓')}
if(ds.q){cart[ds.q]=(cart[ds.q]||0)+ +ds.step;if(cart[ds.q]<1)delete cart[ds.q];saveCart();return route(1)}
if(ds.rm){delete cart[ds.rm];saveCart();return route(1)}
if(ds.cat){flt.cat=ds.cat;flt.sale=false;return}
if(ds.chip){flt.cat=ds.chip;return route(1)}
if(ds.sale){flt.sale=!flt.sale;return route(1)}
if(ds.tab){atab=ds.tab;if(atab!='add'){ed=null;pend='';rem=false}return route(1)}
if(ds.e){ed={...S.products.find(p=>p.id==ds.e)};pend='';rem=false;atab='add';route();return}
if(ds.so){const p=S.products.find(x=>x.id==ds.so);p.stock=!p.stock;route(1);return save(p.stock?'Marked in stock':'Marked sold out')}
if(ds.d){if(confirm('Delete this product?')){S.products=S.products.filter(p=>p.id!=ds.d);route(1);save('Product deleted')}return}
if(id=='cn'){ed=null;pend='';atab='list';return route()}
if(id=='pp'){try{const it=await navigator.clipboard.read();for(const c of it){const ty=c.types.find(x=>x.startsWith('image/'));if(ty){pick(new File([await c.getType(ty)],'pasted.jpg',{type:ty}));return}}toast('No photo in clipboard – copy a photo first',4000)}catch(x){toast('Clipboard is not available in this app',4000)}return}
if(id=='rp'){rem=true;pend='';$('#pv').textContent='No photo';$('#pst').textContent='Photo will be removed when you save.';return}
if(id=='sv'){if(procP){toast('Processing photo…');try{await procP}catch(x){}}
const n=$('#fn').value.trim(),pr=+$('#fp').value;if(!n||!(pr>0))return toast('Please enter the product name and price');
const sl=+$('#fl').value||0;if(sl&&sl>=pr)return toast('Sale price must be lower than the price');
const o={id:ed&&ed.id||'p'+Date.now(),ts:ed&&ed.ts||Date.now(),name:n,cat:$('#fc').value,price:pr,sale:sl,desc:$('#fd').value.trim(),img:pend||(rem?'':(ed&&ed.img)||''),stock:$('#fs').value=='1'};
const i=S.products.findIndex(p=>p.id==o.id);i>=0?S.products[i]=o:S.products.unshift(o);ed=null;pend='';rem=false;procP=null;atab='list';route();return save('Product saved')}
if(id=='ss'){S.sale.pct=Math.max(0,Math.min(90,+$('#sp').value||0));S.sale.text=$('#st').value.trim();route(1);return save('Sale updated')}
if(id=='sx'){S.sale.pct=0;S.sale.text='';route(1);return save('Sale stopped')}
if(id=='sc'){S.cfg.delivery=+$('#cd').value||0;S.cfg.free=+$('#cf').value||0;S.cfg.pay=$('#cp').value.trim()||'Cash on Delivery';S.cfg.policy=$('#cpol').value.trim()||D.policy;S.cfg.about=$('#cab').value.trim()||D.about;
const ph=$('#cw').value.replace(/\D/g,'');if(ph.length>=10)S.phone=ph;const ig=$('#ci').value.trim();if(/^https?:\/\//.test(ig))S.ig=ig;
const np=$('#cpw').value;if(np){if(np.length<6)return toast('Password must be at least 6 characters');S.cfg.pw=await hash(np)}
link();route(1);return save('Settings saved')}
if(id=='pub')return save('Published');
if(id=='po'){const g=i=>$(i).value.trim(),n=g('#oN'),ph=g('#oP'),ci=g('#oC'),ad=g('#oA');
if(!n||ph.replace(/\D/g,'').length<10||!ci||ad.length<8)return toast('Please fill name, phone, city and full address');
const T=totals(),oid='HC-'+Math.floor(1000+Math.random()*9000);
const m='*New Order – Handcrafted Corner* 🌸\nOrder ID: '+oid+'\n\n*Customer:* '+n+'\n*Phone:* '+ph+'\n*City:* '+ci+'\n*Address:* '+ad+'\n\n*Items:*\n'+T.l.map((x,i)=>(i+1)+'. '+x.p.name+' × '+x.q+' – '+rs(eff(x.p)*x.q)).join('\n')+'\n\nSubtotal: '+rs(T.sub)+'\nDelivery: '+(T.dl?rs(T.dl):'Free')+'\n*Total: '+rs(T.tot)+'*\n*Payment:* '+g('#oY')+(g('#oT')?'\n*Note:* '+g('#oT'):'');
const u=wa(m);cart={};saveCart();
app.innerHTML=`<section><div class="wrap" style="max-width:560px"><div class="box" style="text-align:center"><h2>Almost done! 🎉</h2><p>Your order <b>${oid}</b> is ready. Tap the button below and press send in WhatsApp so we can confirm it.</p><a class="btn wa" target="_blank" rel="noopener" href="${u}">Send order on WhatsApp</a><p><a href="#/shop">← Back to shop</a></p></div></div></section>`;window.scrollTo(0,0);return}});
document.addEventListener('input',e=>{const i=e.target.id;
if(i=='q'){flt.q=e.target.value;const l=S.products.filter(p=>(flt.cat=='All'||p.cat==flt.cat)&&p.name.toLowerCase().includes(flt.q.toLowerCase())&&(!flt.sale||eff(p)<p.price));$('#pg').innerHTML=grid(l)||'<p class="empty">No products found.</p>'}
if(i=='as')$('#al').innerHTML=arows(e.target.value);
if(i=='fi'||i=='fc2')pick(e.target.files[0])});
document.addEventListener('change',e=>{const i=e.target.id;if(i=='so'){flt.sort=e.target.value;route(1)}if(i=='fi'||i=='fc2')pick(e.target.files[0])});
addEventListener('paste',e=>{const f=[...((e.clipboardData||{}).files||[])].find(x=>/^image\//.test(x.type));if(f&&$('#pst'))pick(f)});
addEventListener('hashchange',()=>route());link();route();
(async()=>{try{const u=await claude.use('user');if(u&&(u.isOwner()||u.canEdit())){admin=true;try{const d=localStorage.getItem('hc_draft');if(d){Object.assign(S,JSON.parse(d));toast('Unsaved changes restored – press Publish now',7000)}}catch(e){}if(/^#\/admin/.test(location.hash))route(1)}}catch(e){}})();
</script>
</body></html>
